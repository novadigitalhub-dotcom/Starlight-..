<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>STARLIGHT AI</title>
<style>
:root{--c:#00e5ff;--d:rgba(0,229,255,.25)}
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
body{background:#000 radial-gradient(circle at 50% 40%,rgba(0,229,255,.1),transparent 65%);color:var(--c);min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:12px;gap:12px}
.box{background:rgba(0,18,26,.8);border:1px solid var(--d);box-shadow:0 0 15px rgba(0,229,255,.15);padding:12px;border-radius:6px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--c);padding-bottom:10px}
h1{font-size:1.7rem;letter-spacing:4px;text-shadow:0 0 12px var(--c)}
.btn{background:var(--c);color:#000;border:none;padding:8px 14px;font-weight:bold;cursor:pointer;border-radius:4px}
.btn-out{background:transparent;color:var(--c);border:1px solid var(--c);padding:8px 12px;font-weight:bold;cursor:pointer;border-radius:4px}
#cfg{display:none}
#cfg.open{display:block}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
input,select{background:#000;border:1px solid var(--c);color:var(--c);padding:10px;flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px}
.core{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.ring{width:160px;height:160px;border-radius:50%;border:2px dashed var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px var(--d);animation:spin 16s linear infinite}
.face{width:115px;height:115px;border-radius:50%;border:1px solid var(--c);display:flex;align-items:center;justify-content:center;animation:spin 16s linear reverse infinite;background:radial-gradient(circle,rgba(0,229,255,.25),#000)}
.wave{display:flex;gap:4px;height:28px;align-items:center;margin:14px 0}
.wave span{width:4px;height:6px;background:var(--c);box-shadow:0 0 6px var(--c)}
.wave.on span{animation:dance .4s infinite alternate}
.wave.on span:nth-child(2n){animation-delay:.2s}
#mic{padding:12px 24px;border-radius:25px;font-size:1rem;letter-spacing:2px}
#mic.rec{background:#ff2a55;border-color:#ff2a55;color:#fff}
.bar{height:8px;background:rgba(0,229,255,.15);margin:4px 0 10px}
.bar div{height:100%;background:var(--c);box-shadow:0 0 8px var(--c);transition:width .5s}
#log{height:140px;overflow-y:auto;font-size:.8rem;line-height:1.5}
#reply{min-height:54px;padding:10px;background:rgba(0,229,255,.07);border:1px solid var(--d);color:#fff;margin-bottom:8px}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes dance{100%{height:26px}}

</style>
</head>
<body>
<header>
  <div><h1>STARLIGHT</h1><small>PRIME COMMAND HUD</small></div>
  <div style="text-align:right">
    <div id="clk" style="font-weight:bold;font-size:1.1rem">00:00:00</div>
    <div id="dt" style="font-size:.7rem">--</div>
  </div>
  <button class="btn-out" onclick="document.getElementById('cfg').classList.toggle('open')">⚙️ CONFIG</button>
</header>

<div id="cfg" class="box">
  <div><strong>GEMINI API KEY</strong> (Get free at ://google.com)</div>
  <div class="row">
    <input id="keyIn" type="password" placeholder="Paste AIza... key here">
    <button class="btn" onclick="saveKey()">SAVE KEY</button>
  </div>
  <div style="margin-top:12px"><strong>ADD CUSTOM VOICE COMMAND</strong></div>
  <div class="row">
    <input id="cTrig" placeholder="Say phrase (e.g. open whatsapp)">
    <select id="cType" style="max-width:110px"><option value="reply">Reply</option><option value="url">Open URL</option></select>
    <input id="cAct" placeholder="Reply text or https:// link">
    <button class="btn" onclick="addCmd()">+ ADD</button>
  </div>
  <div id="cList" style="margin-top:8px;font-size:.8rem"></div>
</div>

<div class="grid">
  <div class="box">
    <div style="margin-bottom:8px"><strong>SYSTEM STATS</strong></div>
    <div>CPU: <span id="cpuT">32%</span></div><div class="bar"><div id="cpuB" style="width:32%"></div></div>
    <div>RAM: <span id="ramT">58%</span></div><div class="bar"><div id="ramB" style="width:58%"></div></div>
    <div>BATTERY: <span id="batT">--%</span></div><div class="bar"><div id="batB" style="width:100%"></div></div>
    <div>MEMORY NODES: <span id="memT">0</span></div><div class="bar"><div id="memB" style="width:10%"></div></div>
  </div>

  <div class="box core">
    <div class="ring"><div class="face">
      <svg width="75" height="75" viewBox="0 0 100 100" fill="none" stroke="#00e5ff" stroke-width="3">
        <polygon points="30,15 70,15 82,35 76,75 50,90 24,75 18,35"/>
        <polygon points="26,46 44,50 42,56 25,53" fill="#00e5ff"/>
        <polygon points="74,46 56,50 58,56 75,53" fill="#00e5ff"/>
        <polyline points="35,70 50,65 65,70"/>
      </svg>
    </div></div>
    <div class="wave" id="wv"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <button id="mic" class="btn-out" onclick="mic()">🎙️ TALK TO ME</button>
  </div>

  <div class="box">
    <div style="margin-bottom:8px"><strong>SYSTEM LOG</strong></div>
    <div id="log"></div>
  </div>
</div>

<div class="box">
  <div id="reply">STARLIGHT: Prime vocal core online. Neural memory active. I await your command, Boss.</div>
  <div class="row">
    <input id="inp" placeholder="Type a command or question..." onkeypress="if(event.key==='Enter')ask()">
    <button class="btn" onclick="ask()">ASK</button>
  </div>
</div>

<script>
let chatHistory = [];
const log=m=>{const l=document.getElementById('log');l.innerHTML+=`<div>> ${m}</div>`;l.scrollTop=l.scrollHeight};

function say(t){
  document.getElementById('reply').textContent='STARLIGHT: '+t;
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  const vs=speechSynthesis.getVoices();
  const deepVoice=vs.find(v=>v.lang.includes('en')&&(v.name.includes('Male')||v.name.includes('David')||v.name.includes('Daniel')||v.name.includes('UK')||v.name.includes('Google US English')))||vs.find(v=>v.lang.includes('en'));
  if(deepVoice)u.voice=deepVoice;
  u.pitch=0.55;
  u.rate=0.92;
  u.volume=1.0;
  u.onstart=()=>wv.classList.add('on');
  u.onend=()=>wv.classList.remove('on');
  u.onerror=()=>wv.classList.remove('on');
  speechSynthesis.speak(u);
}
if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

function tick(){const n=new Date();clk.textContent=n.toLocaleTimeString();dt.textContent=n.toDateString()}
tick();
setInterval(tick,1000);
setInterval(()=>{const c=20+Math.floor(Math.random()*35),r=50+Math.floor(Math.random()*25);cpuT.textContent=c+'%';cpuB.style.width=c+'%';ramT.textContent=r+'%';ramB.style.width=r+'%'},2500);
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{const p=Math.round(b.level*100);batT.textContent=p+'%'+(b.charging?'⚡':'');batB.style.width=p+'%'};u();b.onlevelchange=u;b.onchargingchange=u});

function updateMemBar(){memT.textContent=chatHistory.length+' msgs';memB.style.width=Math.min(100,chatHistory.length*10)+'%'}
function saveKey(){localStorage.setItem('sk_key',keyIn.value.trim());document.getElementById('cfg').classList.remove('open');log('API Key saved');say('Neural key locked in, Boss.')}
function getCmds(){return JSON.parse(localStorage.getItem('sk_cmds')||'[]')}
function renderCmds(){cList.innerHTML=getCmds().map((c,i)=>`<div>• "${c.t}" → ${c.a} <button onclick="delCmd(${i})" style="color:red;background:none;border:none">[X]</button></div>`).join('')}
function addCmd(){if(!cTrig.value||!cAct.value)return;const l=getCmds();l.push({t:cTrig.value.toLowerCase().trim(),y:cType.value,a:cAct.value.trim()});localStorage.setItem('sk_cmds',JSON.stringify(l));cTrig.value='';cAct.value='';renderCmds();log('Custom command added')}
function delCmd(i){const l=getCmds();l.splice(i,1);localStorage.setItem('sk_cmds',JSON.stringify(l));renderCmds()}

let rec;
if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();rec.lang='en-US';
  rec.onstart=()=>{document.getElementById('mic').classList.add('rec');document.getElementById('mic').textContent='🛑 LISTENING...';wv.classList.add('on');log('Listening...')};
  rec.onresult=e=>{inp.value=e.results.item(0).item(0).transcript;log('Heard: '+inp.value);ask()};
  rec.onend=()=>{document.getElementById('mic').classList.remove('rec');document.getElementById('mic').textContent='🎙️ TALK TO ME';wv.classList.remove('on')};
  rec.onerror=e=>log('Mic error: '+e.error);
}
function mic(){if(!rec)return alert('Use Google Chrome on HTTPS');speechSynthesis.cancel();rec.start()}

async function ask(){
  const q=inp.value.trim();if(!q)return;inp.value='';const l=q.toLowerCase();log('Query: '+q);

  if(l.includes('clear memory')||l.includes('forget everything')||l==='reset'){
    chatHistory=[];updateMemBar();log('Memory wiped');
    return say('Neural memory banks cleared, Boss. Ready for a new mission.');
  }

  const c=getCmds().find(x=>l.includes(x.t));
  if(c){if(c.y==='url'){say('Engaging '+c.t+', Boss.');window.open(c.a.startsWith('http')?c.a:'https://'+c.a,'_blank')}else say(c.a);return}
  if(l.includes('time'))return say('The time is '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+', Boss.');
  if(l.includes('open youtube')){say('Launching YouTube protocols, Boss.');window.open('https://youtube.com','_blank');return}
  if(l==='hello'||l==='hi'||l.startsWith('hello '))return say('Greetings, Boss. All systems stand ready at your command.');

  const k=localStorage.getItem('sk_key');
  if(!k){document.getElementById('cfg').classList.add('open');return say('Boss, paste your Gemini API key in CONFIG to activate my neural core.')}
