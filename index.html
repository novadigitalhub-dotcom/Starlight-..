<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STARLIGHT // PRIME COMMAND HUD</title>
  <style>
    @import url('https://googleapis.com');

    :root {
      --cyan: #00e5ff;
      --cyan-dim: rgba(0, 229, 255, 0.22);
      --cyan-glow: rgba(0, 229, 255, 0.65);
      --bg: #000000;
      --panel: rgba(0, 18, 26, 0.75);
      --alert: #ff2a5f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% 35%, rgba(0, 229, 255, 0.14) 0%, transparent 65%),
        linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .brand h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--cyan);
    }

    .brand p {
      font-size: 0.72rem;
      opacity: 0.8;
      letter-spacing: 1.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .clock-box {
      text-align: right;
    }
        #live-clock {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      text-shadow: 0 0 6px var(--cyan);
    }

    #live-date {
      font-size: 0.7rem;
      opacity: 0.8;
    }

    #config-btn {
      background: rgba(0, 229, 255, 0.12);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 8px var(--cyan-dim);
    }

    #config-btn:active { background: var(--cyan); color: #000; }

    /* GRID LAYOUT */
    .hud-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 12px;
      flex: 1;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 14px;
      box-shadow: inset 0 0 14px rgba(0, 229, 255, 0.12);
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--cyan-dim);
    }

    /* CENTER AI CORE */
    .core-panel {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ring-wrap {
      position: relative;
      width: 185px;
      height: 185px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px auto;
    }

    .ring-outer {
      position: absolute;
      inset: 0;
      border: 3px dashed var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 18px var(--cyan-glow);
      animation: spin 16s linear infinite;
    }

    .ring-inner {
      position: absolute;
      inset: 16px;
      border: 2px solid var(--cyan);
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spinRev 7s linear infinite;
    }

    .ai-face {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.25) 0%, #000 80%);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 22px var(--cyan);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .ai-face.speaking { animation: pulse 0.5s infinite alternate; }

    .eyes { display: flex; gap: 16px; margin-bottom: 10px; }
    .eye {
      width: 22px; height: 7px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      transform: skewX(-12deg);
    }
    .eye.r { transform: skewX(12deg); }

    .mouth {
      width: 40px; height: 6px;
      border: 1px solid var(--cyan);
      background: repeating-linear-gradient(90deg, var(--cyan), var(--cyan) 4px, transparent 4px, transparent 8px);
    }

    .waveform {
      display: flex;
      gap: 5px;
      height: 30px;
      align-items: center;
      margin: 12px 0;
    }

    .bar {
      width: 5px; height: 7px;
      background: var(--cyan);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--cyan);
    }

    .waveform.active .bar { animation: wave 0.45s infinite alternate ease-in-out; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.15s; }
    .bar:nth-child(6) { animation-delay: 0.25s; }
    .bar:nth-child(7) { animation-delay: 0.05s; }
        #mic-btn {
      background: rgba(0, 229, 255, 0.14);
      color: var(--cyan);
      border: 2px solid var(--cyan);
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      padding: 12px 26px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 14px var(--cyan-dim);
    }

    #mic-btn:active { background: var(--cyan); color: #000; }
    #mic-btn.listening {
      border-color: var(--alert);
      color: var(--alert);
      box-shadow: 0 0 18px var(--alert);
    }

    /* STATS */
    .stat { margin-bottom: 12px; }
    .stat-top { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .track { height: 8px; background: rgba(0, 229, 255, 0.12); border-radius: 4px; overflow: hidden; }
    .fill { height: 100%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); transition: width 0.5s; }

    /* SYSTEM LOG */
    #system-log {
      flex: 1;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .log-line { border-left: 2px solid var(--cyan); padding-left: 8px; }

    /* FOOTER INPUT & REPLY */
    footer {
      background: var(--panel);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      padding: 12px;
    }

    #reply-box {
      min-height: 50px;
      padding: 10px;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--cyan-dim);
      border-left: 4px solid var(--cyan);
      border-radius: 4px;
      color: #e6fcff;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .input-group { display: flex; gap: 8px; }

    #cmd-input {
      flex: 1;
      background: #000;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      padding: 11px;
      border-radius: 4px;
      outline: none;
    }

    #ask-btn {
      background: var(--cyan);
      color: #000;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      padding: 0 20px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* CONFIG MODAL */
    #config-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 99;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-box {
      background: #00141e;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 25px var(--cyan-glow);
      border-radius: 10px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
  }
        .modal-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .modal-box input {
      width: 100%;
      background: #000;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 10px;
      margin: 8px 0 16px;
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
    }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions button {
      padding: 8px 16px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--cyan);
    }
    #save-key-btn { background: var(--cyan); color: #000; }
    #close-modal-btn { background: transparent; color: var(--cyan); }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    @keyframes wave { 0% { height: 6px; } 100% { height: 28px; } }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }

    @media (max-width: 820px) {
      .hud-grid { grid-template-columns: 1fr; }
      .core-panel { order: -1; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>STARLIGHT</h1>
      <p>PRIME COMMAND HUD</p>
    </div>
    <div class="header-right">
      <div class="clock-box">
        <div id="live-clock">00:00:00</div>
        <div id="live-date">--/--/----</div>
      </div>
      <button id="config-btn">CONFIG</button>
    </div>
  </header>

  <main class="hud-grid">
    <!-- STATS -->
    <section class="panel">
      <div class="panel-title">SYSTEM STATS</div>
      <div class="stat">
