<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STARLIGHT // TACTICAL AI INTERFACE</title>
<style>
  :root {
    --cyan: #00e5ff;
    --cyan-dim: rgba(0, 229, 255, 0.25);
    --cyan-glow: rgba(0, 229, 255, 0.6);
    --bg: #000000;
    --panel-bg: rgba(0, 20, 28, 0.72);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Courier New', Courier, monospace;
  }

  body {
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 50% 45%, rgba(0, 229, 255, 0.09) 0%, transparent 60%),
      linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px, 24px 24px;
    color: var(--cyan);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px;
    overflow-x: hidden;
  }

  .hud-panel {
    background: var(--panel-bg);
    border: 1px solid var(--cyan-dim);
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.1), inset 0 0 15px rgba(0, 229, 255, 0.05);
    position: relative;
    padding: 14px;
    border-radius: 4px;
  }

  .hud-panel::before, .hud-panel::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--cyan);
    border-style: solid;
    pointer-events: none;
  }
  .hud-panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .hud-panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 2px solid var(--cyan);
    box-shadow: 0 4px 20px rgba(0, 229, 255, 0.25);
    margin-bottom: 14px;
    gap: 10px;
  }

  .brand {
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow: 0 0 10px var(--cyan), 0 0 25px var(--cyan);
  }

  .brand span {
    font-size: 0.7rem;
    letter-spacing: 2px;
    display: block;
    opacity: 0.8;
    text-shadow: none;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .clock-box {
    text-align: right;
  }

  #live-time {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: bold;
    text-shadow: 0 0 8px var(--cyan);
  }

  #live-date {
    font-size: 0.75rem;
    opacity: 0.85;
    letter-spacing: 1px;
  }

  .config-toggle {
    background: rgba(0, 229, 255, 0.12);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 8px 12px;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    box-shadow: 0 0 10px var(--cyan-dim);
  }

  .config-toggle:hover, .config-toggle:active {
    background: var(--cyan);
    color: #000;
  }

  #config-drawer {
    display: none;
    margin-bottom: 14px;
    border-color: var(--cyan);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
  }

  #config-drawer.open {
    display: block;
  }

  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 16px;
  }

  .cfg-section h3 {
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--cyan-dim);
    padding-bottom: 4px;
  }

  .cfg-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .hud-input, .hud-select {
    background: #000;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 8px 10px;
    font-size: 0.85rem;
    outline: none;
    flex: 1;
    min-width: 120px;
  }

  .hud-btn {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 8px 14px;
    font-weight: bold;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .hud-btn-danger {
    background: transparent;
    color: #ff4d6d;
    border: 1px solid #ff4d6d;
    padding: 2px 7px;
    font-size: 0.75rem;
    cursor: pointer;
  }

  #custom-cmd-list {
    max-height: 110px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.8rem;
  }

  .cmd-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 229, 255, 0.07);
    padding: 5px 8px;
    border-left: 2px solid var(--cyan);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 14px;
    flex: 1;
    align-items: stretch;
  }

  .panel-title {
    font-size: 0.85rem;
    letter-spacing: 2px;
    border-bottom: 1px solid var(--cyan-dim);
    padding-bottom: 6px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    text-transform: uppercase;
  }

  .stat-row {
    margin-bottom: 14px;
  }

  .stat-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 4px;
  }

  .bar-track {
    width: 100%;
    height: 8px;
    background: rgba(0, 229, 255, 0.12);
    border: 1px solid var(--cyan-dim);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    width: 50%;
    transition: width 0.6s ease;
  }

  .center-core {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px 10px;
  }

  .reactor-ring {
    position: relative;
    width: 185px;
    height: 185px;
    border-radius: 50%;
    border: 2px dashed var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.35), inset 0 0 25px rgba(0, 229, 255, 0.3);
    animation: spinSlow 18s linear infinite;
  }

  .reactor-ring::before {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 3px solid var(--cyan);
    border-top-color: transparent;
    border-bottom-color: transparent;
    animation: spinReverse 6s linear infinite;
  }

  .ai-face {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.25) 0%, rgba(0, 10, 15, 0.95) 75%);
    border: 1px solid var(--cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: counterSpin 18s linear infinite;
    box-shadow: 0 0 20px var(--cyan-glow);
  }

  .ai-face svg {
    width: 86px;
    height: 86px;
    filter: drop-shadow(0 0 6px var(--cyan));
  }

  .eye-pulse {
    animation: eyeGlow 2s infinite alternate;
  }

  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 36px;
    margin: 16px 0;
  }

  .wave-bar {
    width: 4px;
    height: 8px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    border-radius: 2px;
    transition: height 0.15s ease;
  }

  .waveform.active .wave-bar {
    animation: waveDance 0.45s ease-in-out infinite alternate;
  }

  .waveform.active .wave-bar:nth-child(odd) { animation-delay: 0.1s; }
  .waveform.active .wave-bar:nth-child(2n) { animation-delay: 0.25s; }
  .waveform.active .wave-bar:nth-child(3n) { animation-delay: 0.35s; }

  #mic-btn {
    background: rgba(0, 229, 255, 0.1);
    color: var(--cyan);
    border: 2px solid var(--cyan);
    padding: 12px 26px;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 30px;
    box-shadow: 0 0 15px var(--cyan-dim);
    transition: all 0.25s ease;
    text-transform: uppercase;
  }

  #mic-btn:hover, #mic-btn:active {
    background: var(--cyan);
    color: #000;
    box-shadow: 0 0 25px var(--cyan);
  }

  #mic-btn.listening {
    background: #ff2a55;
    border-color: #ff2a55;
    color: #fff;
    box-shadow: 0 0 25px #ff2a55;
    animation: pulseRed 1s infinite;
  }

  #system-log {
    height: 240px;
    overflow-y: auto;
    font-size: 0.8rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-entry {
    opacity: 0.9;
    border-left: 2px solid var(--cyan);
    padding-left: 8px;
  }

  .bottom-console {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #reply-box {
    min-height: 60px;
    max-height: 140px;
    overflow-y: auto;
    padding: 12px;
    background: rgba(0, 229, 255, 0.06);
    border: 1px solid var(--cyan-dim);
    font-size: 0.95rem;
    line-height: 1.4;
    color: #fff;
    text-shadow: 0 0 4px var(--cyan);
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  #cmd-input {
    flex: 1;
    background: #000;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 12px 14px;
    font-size: 1rem;
    outline: none;
    box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2);
  }

  #cmd-input::placeholder {
    color: rgba(0, 229, 255, 0.45);
  }

  #ask-btn {
    background: var(--cyan);
    color: #000;
    border: none;
    padding: 0 24px;
    font-size: 1rem;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 15px var(--cyan-glow);
    transition: transform 0.15s;
  }

  #ask-btn:active {
    transform: scale(0.96);
  }

  @keyframes spinSlow { 100% { transform: rotate(360deg); } }
  @keyframes counterSpin { 100% { transform: rotate(-360deg); } }
  @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
  @keyframes eyeGlow { 0% { opacity: 0.6; } 100% { opacity: 1; } }
  @keyframes waveDance { 0% { height: 6px; } 100% { height: 32px; } }
  @keyframes pulseRed { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  @media (max-width: 850px) {
    .main-grid, .config-grid {
      grid-template-columns: 1fr;
    }
    .center-core {
      order: -1;
    }
    #system-log {
      height: 130px;
    }
    header {
      justify-content: center;
      text-align: center;
    }
    .header-right {
